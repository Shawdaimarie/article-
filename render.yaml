databases:
  - name: article-db
    plan: free
    databaseName: article
    user: article

services:
  - type: web
    name: article-api
    runtime: python
    plan: free
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn article.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: article-db
          property: connectionString
