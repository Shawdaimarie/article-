[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "article-cli"
version = "1.0.0"
description = "A governance and eval engine that checks a project against a machine-readable charter of engineering principles."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shawdaimarie" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click==8.1.7",
    "pyyaml==6.0.1",
    "rich==13.7.1",
    "requests==2.34.2",
]

[project.optional-dependencies]
api = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pydantic==2.14.3",
]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[project.scripts]
article = "article.cli:main"

[project.urls]
Homepage = "https://github.com/Shawdaimarie/article-"
Repository = "https://github.com/Shawdaimarie/article-"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
article = ["data/*.yaml", "api/static/*"]
